test_size: 0.01
num_saving_steps: 10
gradient_checkpointing: False # needs to be False for DiffAttn LoRA (https://github.com/kohya-ss/sd-scripts/issues/323 might be related)
resume_from_checkpoint: False
trainer:
  dataloader_num_workers: 4
  eval_accumulation_steps: 4
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  weight_decay: 0.1
  warmup_ratio: 0.05
  learning_rate: 5e-5
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  bf16: True
  report_to: "wandb"
lora:
  target_modules: ["gate_proj", "up_proj", "down_proj"] # undefined behavior if add other linear layers from attn
  lora_alpha: 64
  lora_dropout: 0.1
  r: 32
  bias: "none"
  task_type: "CAUSAL_LM"
