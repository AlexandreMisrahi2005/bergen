test_size: 64
num_saving_steps: 10
wandb_project_name: "ft" # used if trainer.report_to == "wandb"
resume_from_checkpoint: False
gradient_checkpointing: True
trainer:
  dataloader_num_workers: 2
  eval_accumulation_steps: 4
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  weight_decay: 0.1
  warmup_ratio: 0.05
  learning_rate: 1e-4
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  bf16: True
  report_to: "wandb"
prompt_tuning: 
  prompt_tuning_init_text: "You are a helpful assistant. Your task is to extract relevant information from provided documents and to answer to questions as briefly as possible."
